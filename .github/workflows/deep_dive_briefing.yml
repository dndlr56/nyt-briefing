name: Deep Dive Knowledge Briefing

on:
  push:
    # feat/deep-dive-briefing 테스트 전용: 푸시 시 2~3인 대화형 오디오 + 5개 핵심 탭 자동 배정 실측
    branches:
      - feat/deep-dive-briefing
  schedule:
    # 매일(평일·토·일 포함) 한국시간(KST, UTC+9) 오전 7시 30분 = UTC 22시 30분
    # (매일 07:00 KST 뉴스 브리핑과 30분 간격 + concurrency 그룹으로 gh-pages 충돌 방지)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: '테마 슬롯 선택 (auto=요일별 로테이션, 주말은 5대 핵심 탭에 자동 배정)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - ai_tech
          - science_mind
          - health_medicine
          - econ_geopolitics
          - law_cases
          - weekend_special
      target_minutes:
        description: '목표 오디오 분량(분, 15~60 — 토큰 실측 후 조정 권장)'
        required: true
        default: '25'
        type: choice
        options:
          - '20'
          - '25'
          - '30'
          - '40'
          - '50'
          - '60'
      api_tier:
        description: 'Gemini API 모드 (auto=무료 우선 후 한도 소진 시 유료 자동 전환 / free=무료 전용 / paid=유료 전용)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - free
          - paid
      note_model:
        description: 'Stage 1 원문 충실 요약 노트 모델 (기본: gemini-4-hydrogen, thinking=high)'
        required: true
        default: 'gemini-4-hydrogen'
        type: choice
        options:
          - gemini-4-hydrogen
          - gemini-3.5-flash-lite
      script_model:
        description: 'Stage 2 다중 화자 대화형 대본 모델 (기본: gemini-4-hydrogen, thinking=low)'
        required: true
        default: 'gemini-4-hydrogen'
        type: choice
        options:
          - gemini-4-hydrogen
          - gemini-3.5-flash-lite
      tts_provider:
        description: '다중 화자 TTS 엔진 (gemini_tts=2인 네이티브 대화 기본 / google_cloud_tts=Chirp3-HD 병렬 / edge_tts=무료 무제한)'
        required: true
        default: 'gemini_tts'
        type: choice
        options:
          - gemini_tts
          - google_cloud_tts
          - edge_tts
      tts_model:
        description: 'gemini_tts 모델 선택 (기본: gemini-3.8-flash-lite-tts)'
        required: true
        default: 'gemini-3.8-flash-lite-tts'
        type: choice
        options:
          - gemini-3.8-flash-lite-tts
          - gemini-3.8-flash-tts
      source_url:
        description: '(선택) 자동 수집 대신 직접 해부할 특정 논문/기사/PDF URL'
        required: false
        default: ''
      search_title:
        description: '(선택) OpenAlex/Europe PMC/S2에서 특정 논문 제목으로 먼저 검색 (미확보 시 일반 테마로 폴백)'
        required: false
        default: ''
      skip_audio:
        description: '오디오 생성 생략 (웹 노트 + Drive 아카이빙만 실행)'
        required: false
        default: false
        type: boolean

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  run-deep-dive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache static ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg-bin
          key: ffmpeg-static-linux64-v1

      - name: Ensure ffmpeg is installed
        run: |
          if [ ! -x "$HOME/.local/ffmpeg-bin/ffmpeg" ] || [ ! -x "$HOME/.local/ffmpeg-bin/ffprobe" ]; then
            mkdir -p "$HOME/.local/ffmpeg-bin" /tmp/ffmpeg-dl
            curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
              | tar -xJ --strip-components=2 -C /tmp/ffmpeg-dl --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            mv /tmp/ffmpeg-dl/ffmpeg /tmp/ffmpeg-dl/ffprobe "$HOME/.local/ffmpeg-bin/"
            chmod +x "$HOME/.local/ffmpeg-bin/ffmpeg" "$HOME/.local/ffmpeg-bin/ffprobe"
            rm -rf /tmp/ffmpeg-dl
          fi
          echo "$HOME/.local/ffmpeg-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch existing gh-pages snapshot (read history & preserve news feed)
        run: |
          mkdir -p _gh_pages/deep
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages | tar -x -C _gh_pages
            mkdir -p _gh_pages/deep
          fi

      - name: Run Deep Dive Knowledge Briefing
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_TTS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CLOUD_TTS_CREDENTIALS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PODCAST_OWNER_EMAIL: ${{ secrets.PODCAST_OWNER_EMAIL }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          DEEP_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deep
        run: |
          THEME="auto"
          TARGET_MINUTES="25"
          API_TIER="auto"
          NOTE_MODEL="gemini-4-hydrogen"
          SCRIPT_MODEL="gemini-4-hydrogen"
          TTS_PROVIDER="gemini_tts"
          TTS_MODEL="gemini-3.8-flash-lite-tts"
          SOURCE_URL=""
          SEARCH_TITLE=""
          SKIP_AUDIO="false"

          if [ "${{ github.event_name }}" = "push" ]; then
            THEME="weekend_special"
            SEARCH_TITLE="Dementia prevention, intervention, and care: 2024 report of the Lancet standing Commission"
            TARGET_MINUTES="25"
            API_TIER="auto"
            TTS_PROVIDER="gemini_tts"
            TTS_MODEL="gemini-3.8-flash-lite-tts"
            SKIP_AUDIO="false"
            echo "[INFO] Feature branch push test: Lancet 2024 -> 2-speaker non-roleplay + 2-part cached script + gemini-3.8-flash-lite-tts (auto Free->Paid failover)."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            THEME="${{ inputs.theme }}"
            TARGET_MINUTES="${{ inputs.target_minutes }}"
            API_TIER="${{ inputs.api_tier }}"
            NOTE_MODEL="${{ inputs.note_model }}"
            SCRIPT_MODEL="${{ inputs.script_model }}"
            TTS_PROVIDER="${{ inputs.tts_provider }}"
            TTS_MODEL="${{ inputs.tts_model }}"
            SOURCE_URL="${{ inputs.source_url }}"
            SEARCH_TITLE="${{ inputs.search_title }}"
            SKIP_AUDIO="${{ inputs.skip_audio }}"
          fi

          export GEMINI_API_TIER="$API_TIER"
          if [ "$API_TIER" = "paid" ]; then
            export GEMINI_API_KEY="$GEMINI_PAID_API_KEY"
            echo "[INFO] Gemini API mode: paid (GEMINI_PAID_API_KEY)"
          elif [ "$API_TIER" = "free" ]; then
            export GEMINI_API_KEY="$GEMINI_FREE_API_KEY"
            echo "[INFO] Gemini API mode: free-only (GEMINI_FREE_API_KEY)"
          else
            export GEMINI_API_KEY="${GEMINI_FREE_API_KEY:-$GEMINI_PAID_API_KEY}"
            echo "[INFO] Gemini API mode: auto (Free first -> automatic Paid failover on quota exhaustion)"
          fi

          EXTRA_ARGS=()
          if [ -n "$SOURCE_URL" ]; then
            EXTRA_ARGS+=(--source-url "$SOURCE_URL")
          fi
          if [ -n "$SEARCH_TITLE" ]; then
            EXTRA_ARGS+=(--search-title "$SEARCH_TITLE")
          fi
          if [ "$SKIP_AUDIO" = "true" ]; then
            EXTRA_ARGS+=(--skip-audio)
          fi

          python src/deep_dive/main.py \
            --theme "$THEME" \
            --target-minutes "$TARGET_MINUTES" \
            --note-model "$NOTE_MODEL" \
            --script-model "$SCRIPT_MODEL" \
            --tts-provider "$TTS_PROVIDER" \
            --tts-model "$TTS_MODEL" \
            --podcast-dir _gh_pages/deep \
            --podcast-base-url "$DEEP_BASE_URL" \
            --output-dir output/deep_dive \
            "${EXTRA_ARGS[@]}"

      - name: Publish Deep Dive Web Reader & RSS to gh-pages (preserving root news feed)
        run: |
          if [ ! -f _gh_pages/deep/feed.xml ]; then
            echo "deep/feed.xml not found; skipping gh-pages publish."
            exit 0
          fi

          # 최신 origin/gh-pages를 다시 받아 _gh_pages/deep 만 안전하게 병합
          mkdir -p _gh_pages_merge
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages | tar -x -C _gh_pages_merge
          fi
          rm -rf _gh_pages_merge/deep
          cp -r _gh_pages/deep _gh_pages_merge/deep
          touch _gh_pages_merge/.nojekyll

          cd _gh_pages_merge
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Deep Dive Knowledge Briefing ($(date -u +%Y-%m-%d))"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages

      - name: Upload Deep Dive artifacts (notes, script, MP3, benchmark summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-dive-briefing-output
          path: output/deep_dive/
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify Telegram on failure
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="⚠️ <b>Deep Dive 브리핑 워크플로우 (${JOB_STATUS})</b>%0A%0A• 실행 방식: <code>${{ github.event_name }}</code>%0A• 로그 확인: ${RUN_URL}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}" >/dev/null || true
