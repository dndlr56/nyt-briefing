name: NYT Morning Briefing

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 7시 00분 = UTC 22시 00분
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 선택'
        required: true
        default: 'podcast_only'
        type: choice
        options:
          - podcast_only
          - podcast_and_telegram_text
          - telegram_text_and_audio
          - telegram_audio_only
      api_tier:
        description: 'Gemini API 키 선택 (free: GEMINI_FREE_API_KEY 무료 티어 / paid: 기존 GEMINI_API_KEY)'
        required: true
        default: 'free'
        type: choice
        options:
          - free
          - paid
      tts_provider:
        description: 'TTS 엔진 선택 (기본값: gemini_tts 무료 티어)'
        required: true
        default: 'gemini_tts'
        type: choice
        options:
          - gemini_tts
          - google_cloud_tts
          - edge_tts
      tts_model:
        description: 'gemini_tts 선택 시 모델 (기본값: gemini-3.8-flash-tts)'
        required: false
        default: 'gemini-3.8-flash-tts'
        type: choice
        options:
          - gemini-3.8-flash-tts
          - gemini-3.8-flash-lite-tts
      voice:
        description: '앵커 목소리 선택 (auto_rotate: 매일 다른 Gemini 여성 목소리 자동 순환)'
        required: true
        default: 'auto_rotate'
        type: choice
        options:
          - auto_rotate
          - Kore
          - Aoede
          - Erinome
          - Despina
          - Sulafat
          - Vindemiatrix
          - Zephyr
          - Leda
          - Callirrhoe
          - Gacrux
          - Charon
          - ko-KR-Chirp3-HD-Kore
          - ko-KR-Chirp3-HD-Charon
          - ko-KR-Neural2-C
          - ko-KR-HyunsuMultilingualNeural

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache static ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg-bin
          key: ffmpeg-static-linux64-v1

      - name: Ensure ffmpeg is installed
        run: |
          if [ ! -x "$HOME/.local/ffmpeg-bin/ffmpeg" ] || [ ! -x "$HOME/.local/ffmpeg-bin/ffprobe" ]; then
            mkdir -p "$HOME/.local/ffmpeg-bin" /tmp/ffmpeg-dl
            curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
              | tar -xJ --strip-components=2 -C /tmp/ffmpeg-dl --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            mv /tmp/ffmpeg-dl/ffmpeg /tmp/ffmpeg-dl/ffprobe "$HOME/.local/ffmpeg-bin/"
            chmod +x "$HOME/.local/ffmpeg-bin/ffmpeg" "$HOME/.local/ffmpeg-bin/ffprobe"
            rm -rf /tmp/ffmpeg-dl
          fi
          echo "$HOME/.local/ffmpeg-bin" >> "$GITHUB_PATH"
          "$HOME/.local/ffmpeg-bin/ffmpeg" -version | head -n 1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare existing gh-pages podcast directory
        run: |
          mkdir -p _gh_pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages | tar -x -C _gh_pages
          fi

      - name: Run Global Morning Briefing (AntennaPod RSS + Telegram Text)
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_TTS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CLOUD_TTS_CREDENTIALS_JSON }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          MODE="podcast_only"
          API_TIER="free"
          TTS_PROVIDER="gemini_tts"
          TTS_MODEL="gemini-3.8-flash-tts"
          VOICE="auto_rotate"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            API_TIER="${{ inputs.api_tier }}"
            TTS_PROVIDER="${{ inputs.tts_provider }}"
            TTS_MODEL="${{ inputs.tts_model }}"
            VOICE="${{ inputs.voice }}"
          fi

          if [ "$API_TIER" = "free" ] && [ -n "$GEMINI_FREE_API_KEY" ]; then
            export GEMINI_API_KEY="$GEMINI_FREE_API_KEY"
            export GEMINI_API_TIER="free"
            echo "[INFO] Using GEMINI_FREE_API_KEY (Free Tier $0)"
          else
            export GEMINI_API_KEY="$GEMINI_PAID_API_KEY"
            export GEMINI_API_TIER="paid"
            if [ "$API_TIER" = "free" ]; then
              echo "[WARN] GEMINI_FREE_API_KEY secret not set yet; falling back to GEMINI_API_KEY (Paid Tier)."
            else
              echo "[INFO] Using GEMINI_API_KEY (Paid Tier)"
            fi
          fi

          if [ "$MODE" = "podcast_and_telegram_text" ]; then
            python src/main.py \
              --with-audio \
              --skip-telegram-audio \
              --podcast-dir _gh_pages \
              --podcast-base-url "$PAGES_BASE_URL" \
              --tts-provider "$TTS_PROVIDER" \
              --tts-model "$TTS_MODEL" \
              --voice "$VOICE" \
              --output-dir output
          elif [ "$MODE" = "podcast_only" ]; then
            python src/main.py \
              --with-audio \
              --skip-telegram-text \
              --skip-telegram-audio \
              --podcast-dir _gh_pages \
              --podcast-base-url "$PAGES_BASE_URL" \
              --tts-provider "$TTS_PROVIDER" \
              --tts-model "$TTS_MODEL" \
              --voice "$VOICE" \
              --output-dir output
          elif [ "$MODE" = "telegram_text_and_audio" ]; then
            python src/main.py \
              --with-audio \
              --tts-provider "$TTS_PROVIDER" \
              --tts-model "$TTS_MODEL" \
              --voice "$VOICE" \
              --output-dir output
          else
            python src/main.py \
              --audio-only \
              --tts-provider "$TTS_PROVIDER" \
              --tts-model "$TTS_MODEL" \
              --voice "$VOICE" \
              --output-dir output
          fi

      - name: Publish AntennaPod RSS feed to gh-pages
        if: github.event_name == 'schedule' || inputs.mode == 'podcast_and_telegram_text' || inputs.mode == 'podcast_only'
        run: |
          if [ ! -f _gh_pages/feed.xml ]; then
            echo "feed.xml not found; skipping gh-pages publish."
            exit 0
          fi
          touch _gh_pages/.nojekyll
          cd _gh_pages
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Global Morning Briefing podcast feed ($(date -u +%Y-%m-%d))"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages

      - name: Upload generated script and MP3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-audio-briefing-output
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify Telegram on failure or cancellation
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping alert."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$JOB_STATUS" = "cancelled" ]; then
            STATUS_LABEL="취소됨 (cancelled)"
          else
            STATUS_LABEL="실패함 (failed)"
          fi
          MSG="⚠️ <b>글로벌 모닝 브리핑 워크플로우 ${STATUS_LABEL}</b>%0A%0A• 실행 방식: <code>${{ github.event_name }}</code>%0A• 로그 확인: ${RUN_URL}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}" >/dev/null || echo "Failed to send Telegram alert."
