name: NYT Morning Briefing

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 8시 30분 = UTC 23시 30분
    # (참고: 예약 실행은 기본 브랜치인 main에서만 동작하며, 이 테스트 브랜치에서는 자동 실행되지 않습니다.)
    - cron: '30 23 * * *'
  # GitHub Actions 탭에서 브랜치를 exp/fulltext-briefing으로 선택해 수동 1회 테스트 실행
  workflow_dispatch:
    inputs:
      mode:
        description: '전송 방식 선택'
        required: true
        default: 'audio_only'
        type: choice
        options:
          - audio_only
          - text_and_audio
          - text_only
      voice:
        description: '앵커 목소리 선택 (전 구간 한 목소리 고정)'
        required: true
        default: 'Kore'
        type: choice
        options:
          - Kore
          - Charon
          - Aoede
          - Puck
          - Fenrir
          - Alnilam
      tts_model:
        description: 'TTS 모델 선택'
        required: true
        default: 'gemini-3.8-flash-tts'
        type: choice
        options:
          - gemini-3.8-flash-tts
          - gemini-3.8-flash-lite-tts

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Ensure ffmpeg is installed
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'text_only'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Global Morning Briefing (The Guardian Full-Text)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "audio_only" ]; then
              python src/main.py --audio-only \
                --voice "${{ inputs.voice }}" \
                --tts-model "${{ inputs.tts_model }}" \
                --output-dir output
            elif [ "${{ inputs.mode }}" = "text_and_audio" ]; then
              python src/main.py --with-audio \
                --voice "${{ inputs.voice }}" \
                --tts-model "${{ inputs.tts_model }}" \
                --output-dir output
            else
              python src/main.py
            fi
          else
            python src/main.py
          fi

      - name: Upload generated script and MP3 artifact
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode != 'text_only'
        uses: actions/upload-artifact@v4
        with:
          name: guardian-audio-briefing-output
          path: output/
          retention-days: 7
          if-no-files-found: ignore
